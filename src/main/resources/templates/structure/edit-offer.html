<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::section})}">

<body>
    <section>
        <div class="bg-gray-100 py-12">
            <div class="container mx-auto px-6">
                <h1 class="text-3xl font-bold text-meland-dark">Créer une offre de prêt</h1>
                <p class="text-gray-500">Remplissez les détails pour publier votre offre sur Meland.</p>
            </div>
        </div>

        <div class="container mx-auto px-6 py-12">
            <div class="max-w-4xl mx-auto bg-white p-12 rounded-[3rem] shadow-sm border border-gray-100">
                <form class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="col-span-2">
                            <label class="block text-sm font-bold text-gray-700 mb-2">Titre de l'offre</label>
                            <input type="text" placeholder="Ex: Prêt Scolaire Élite"
                                class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Type de prêt</label>
                            <select
                                class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20">
                                <option>Micro-crédit</option>
                                <option>Prêt PME</option>
                                <option>Prêt agricole</option>
                                <option>Prêt scolaire</option>
                                <option>Prêt personnel</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Commune</label>
                            <input type="text" placeholder="Ex: Cocody"
                                class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Montant Minimum (FCFA)</label>
                            <input type="number" placeholder="50000"
                                class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Montant Maximum (FCFA)</label>
                            <input type="number" placeholder="1000000"
                                class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Taux d'intérêt (%/mois)</label>
                            <input type="number" step="0.1" placeholder="3"
                                class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Durée (mois)</label>
                            <input type="number" placeholder="12"
                                class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Description complète</label>
                        <textarea rows="4"
                            class="w-full px-4 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-meland-green/20"></textarea>
                    </div>

                    <div class="flex gap-4 pt-6">
                        <button type="button"
                            class="flex-grow bg-meland-green text-white py-5 rounded-2xl font-bold text-lg hover:shadow-xl transition">Publier
                            l'offre</button>
                        <a href="/structure/dashboard"
                            class="px-10 py-5 bg-gray-100 rounded-2xl font-bold text-gray-500 hover:bg-gray-200 transition">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>

</html>
